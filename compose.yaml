# Dagu: scheduler + web UI + coordinator + execution worker.
#
# The worker has the coding agents and development tools. It receives host auth
# through narrowly-scoped mounts, and mounts the project paths at their original
# absolute locations because the DAG definitions use those paths.
#
# See README.md for why, and docs.dagu.sh/configurations/deployment/docker-compose
# for the upstream reference this is based on.

services:
  dagu:
    image: ghcr.io/dagucloud/dagu:latest
    container_name: dagu
    hostname: dagu

    ports:
      - "127.0.0.1:8525:8080"     # web UI
      - "127.0.0.1:50055:50055"   # optional host CLI access

    entrypoint: ["/usr/local/bin/tini", "-g", "--"]
    command:
      - dagu
      - start-all
      - --config=/var/lib/dagu/service.yaml
      # Bind the coordinator to all interfaces so it is reachable through the
      # published port. Advertise the Compose DNS name used by the worker.
      - --coordinator.host=0.0.0.0
      - --coordinator.advertise=dagu

    environment:
      - DAGU_HOME=/var/lib/dagu
      - DAGU_HOST=0.0.0.0
      - DAGU_PORT=8080
      - DAGU_DAGS_DIR=/var/lib/dagu/dags
      - DAGU_AUTH_MODE=none   # published on localhost only
      - DAGU_TZ=Asia/Ho_Chi_Minh

    volumes:
      - ./dags:/var/lib/dagu/dags
      - ./service.yaml:/var/lib/dagu/service.yaml:ro
      - ./data:/var/lib/dagu/data
      - ./logs:/var/lib/dagu/logs

    # No /var/run/docker.sock mount: the upstream reference includes it for
    # Docker-in-Docker, but nothing executes inside this container here.

    user: "0:0"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    hostname: dagu-worker
    depends_on:
      - dagu
    command:
      - dagu
      - worker
      - --worker.coordinators=dagu:50055
      - --worker.labels
      - host=true
    environment:
      HOME: /root
      CODEX_HOME: /root/.codex
      # Claude Code refuses `--permission-mode bypassPermissions` when it runs as
      # uid 0 unless IS_SANDBOX is set, and this container is root by
      # construction: every mount lands under /root. Codex has no equivalent
      # check, so this only started mattering when agent.yaml switched to claude.
      # The container is the sandbox the flag asks for -- it holds one project
      # tree and scoped credential mounts -- so declare that rather than rebuild
      # the image around a non-root user.
      IS_SANDBOX: "1"
      # macOS gh keeps the active token in Keychain, which is not available in
      # Linux. The worker entrypoint converts this into its own gh config file.
      GH_TOKEN: ${GH_TOKEN:-}
      DAGU_HOME: /var/lib/dagu
      DAGU_TZ: Asia/Ho_Chi_Minh
      # The DAG definitions expand ${DAGU_ROOT} to find their own scripts and
      # prompts. Set in .env, and must match the host path used below so the
      # in-container path is identical to the one the DAGs refer to.
      DAGU_ROOT: ${DAGU_ROOT}
    volumes:
      # Project files. Keep the host paths unchanged inside the worker because
      # the DAGs and Docker-backed test commands refer to these absolute paths.
      # DAGU_ROOT, PROJECT_WORKSPACE and PROJECT_WORKTREES_DIR come from .env
      # (see .env.example) so this file needs no per-host edits.
      - ${DAGU_ROOT}:${DAGU_ROOT}
      - ${PROJECT_WORKSPACE}:${PROJECT_WORKSPACE}
      - ${PROJECT_WORKTREES_DIR}:${PROJECT_WORKTREES_DIR}
      - /tmp/dagu-agent:/tmp/dagu-agent

      # Yarn Berry's global cache, on a named volume so it survives the image
      # being rebuilt. sweatcharge_fe pins yarn 4 and leaves `enableGlobalCache`
      # at its default, so every install in every worktree reads and writes this
      # one directory. Without the volume it lives on the container's writable
      # layer and `make up --build` throws it away -- and the next frontend run
      # re-fetches the whole Angular tree, which is what made a cold
      # `yarn install` stall for minutes inside an agent phase's budget and take
      # the phase down with it. A git worktree never has node_modules, so this is
      # paid on every run; the volume is what makes it a warm minute rather than
      # a cold several.
      - yarn-cache:/root/.yarn/berry/cache

      # Authentication and agent extensions. Credential files are writable so
      # their CLIs can refresh tokens; configuration and skills are read-only.
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json
      - ${HOME}/.codex/config.toml:/root/.codex/config.toml:ro
      - ${HOME}/.codex/skills:/root/.codex/skills:ro
      - ${HOME}/.codex/plugins:/root/.codex/plugins:ro
      # The configured SweatCharge skills are symlinks into this repository.
      - ${DOTFILES_DIR}:${DOTFILES_DIR}:ro
      # No ~/.claude/.credentials.json mount, unlike the codex one above: macOS
      # Claude Code keeps its credentials in the Keychain, so that path holds
      # nothing to mount -- and naming a source that does not exist makes Docker
      # create an empty directory there, which would then shadow the real file if
      # one ever appeared. The worker authenticates with its own token instead;
      # see the claude branch of run-agent.sh.
      # opencode keeps its provider logins in a plain file under the XDG data
      # directory rather than in the Keychain, so unlike claude it can reuse the
      # host login directly. Writable for the same reason as the codex one: the
      # OAuth entries in it are refreshed in place. Only the file is mounted, not
      # its directory -- that directory also holds opencode.db, which is close to
      # a gigabyte of local session history the worker has no use for.
      - ${HOME}/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json
      - ${HOME}/.config/opencode:/root/.config/opencode:ro
      - ${HOME}/.claude/settings.json:/root/.claude/settings.json:ro
      - ${HOME}/.claude/plugins:/root/.claude/plugins:ro
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - ${HOME}/.ssh:/root/.ssh:ro

      # The implementation agent runs the target repository's Docker test stack.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  # Survives `make up --build`. Delete it with
  # `docker volume rm dagu_yarn-cache` if a cache entry is ever corrupted -- the
  # next run repopulates it, slowly, and nothing else depends on its contents.
  yarn-cache:
