type: graph
description: Clarify cuongkane/sweatcharge issues labelled agent:todo
schedule: "*/5 * * * *"
overlap_policy: skip

# Every step needs gh/jq and the local repo, so the whole DAG runs on the native
# host worker rather than inside the dagu container. Only the pollers carry this
# selector -- see the note at the top of agent-implement-issue.yaml.
worker_selector:
  host: "true"

# Faster than the other two pollers on purpose. Clarification is the one step a
# human is waiting on, it is read-only, and it costs a few cents.

consts:
  - repo: cuongkane/sweatcharge
  - workspace: /Users/lexuancuong/CUONG/SWC
  - skill: clarify-sweatcharge-issue
  - bin_dir: /Users/lexuancuong/CUONG/DAGU/bin

steps:
  - id: pick_issue
    run: |
      set -eu
      picked=$(${consts.bin_dir}/pick-oldest.sh ${consts.repo} agent:todo agent:clarifying)

      # By far the most common cause of "I filed it and nothing happened": only
      # the agent-feature issue template applies the label, so a blank issue or
      # a plain `gh issue create` lands unlabelled and invisible to every poller.
      if [ "$picked" = "none" ]; then
        bare=$(gh issue list --repo ${consts.repo} --state open --limit 200 \
          --json number,labels \
          --jq '[.[] | select([.labels[].name] | any(startswith("agent:")) | not)
                     | "#\(.number)"] | join(", ")' 2>/dev/null || echo "")
        [ -z "$bare" ] || echo "[pick_issue] hint: open issues carrying no agent:* label: $bare" >&2
      fi

      echo "$picked"
    output: ISSUE_NUMBER

  - id: claim
    depends: pick_issue
    preconditions:
      - condition: 'test "${ISSUE_NUMBER}" != "none"'
    # Claiming is what makes the label the lock: from here the issue is
    # agent:clarifying, which no poller queries, so nothing else can pick it up.
    # A non-zero exit means someone changed the label between the list and now --
    # not an error, just a reason to do nothing this tick.
    run: |
      set -u
      if ${consts.bin_dir}/relabel.sh ${consts.repo} "${ISSUE_NUMBER}" agent:todo agent:clarifying; then
        echo yes
      else
        echo no
      fi
    output: CLAIMED
    continue_on: skipped      # an idle poll must finish green, not red

  - id: dispatch
    depends: claim
    preconditions:
      # When `claim` is skipped, dagu leaves ${CLAIMED} as literal text rather
      # than substituting an empty string -- which fails this test, which is the
      # outcome we want anyway.
      - condition: 'test "${CLAIMED}" = "yes"'
    action: dag.run
    with:
      dag: agent-clarify-issue
      params:
        REPO: ${consts.repo}
        WORKSPACE: ${consts.workspace}
        SKILL: ${consts.skill}
        ISSUE_NUMBER: "${ISSUE_NUMBER}"
    continue_on: skipped
