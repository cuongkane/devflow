type: graph
description: Health check - prove the host worker is reachable, tooled and logged in

# Run this whenever the pipeline is silently doing nothing. It fails on the
# exact step that is broken, which is faster than reading scheduler logs.
worker_selector:
  host: "true"

steps:
  - id: tools
    run: |
      set -eu
      agent=$(awk '/^[[:space:]]*agent:[[:space:]]*/ {print $2; exit}' /Users/lexuancuong/CUONG/DAGU/agent.yaml)
      case "$agent" in codex|claude) ;; *) echo "Unsupported agent: $agent" >&2; exit 2 ;; esac
      for bin in "$agent" gh git jq make docker; do
        printf '%-8s %s\n' "$bin" "$(command -v "$bin" || echo MISSING)"
        command -v "$bin" >/dev/null
      done

  - id: github_auth
    depends: tools
    run: gh auth status

  - id: agent_auth
    depends: tools
    timeout_sec: 120
    run: |
      set -eu
      agent=$(awk '/^[[:space:]]*agent:[[:space:]]*/ {print $2; exit}' /Users/lexuancuong/CUONG/DAGU/agent.yaml)
      case "$agent" in
        codex) printf 'Reply with exactly OK' | codex exec --sandbox read-only --skip-git-repo-check - ;;
        claude) claude -p "Reply with exactly OK" --max-turns 1 ;;
      esac
