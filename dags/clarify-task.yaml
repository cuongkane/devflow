type: graph
description: Pick and clarify a GitHub issue that is waiting for requirements
schedule: "*/5 * * * *"
overlap_policy: skip
max_output_size: 10485760

worker_selector:
  host: "true"

dotenv: /Users/lexuancuong/CUONG/DAGU/project.env

params:
  - name: ISSUE_NUMBER
    type: string
    default: ""
    description: Optional issue to claim immediately instead of polling the queue

consts:
  - prompts_dir: /Users/lexuancuong/CUONG/DAGU/prompts
  - bin_dir: /Users/lexuancuong/CUONG/DAGU/bin
  - agent_runner: /Users/lexuancuong/CUONG/DAGU/run-agent.sh
  - budget_usd: "4"

steps:
  - id: pick_issue
    run: |
      set -eu
      if [ -n "${params.ISSUE_NUMBER}" ]; then
        echo "${params.ISSUE_NUMBER}"
      else
        ${consts.bin_dir}/pick-oldest.sh "${env.PROJECT_REPO}" agent:todo agent:clarifying
      fi
    output: ISSUE_NUMBER

  - id: claim
    depends: pick_issue
    preconditions:
      - condition: 'test "${ISSUE_NUMBER}" != "none"'
    run: |
      set -u
      if ${consts.bin_dir}/relabel.sh "${env.PROJECT_REPO}" "${ISSUE_NUMBER}" agent:todo agent:clarifying; then
        echo yes
      else
        echo no
      fi
    output: CLAIMED
    continue_on: skipped

  - id: fetch_issue
    depends: claim
    preconditions:
      - condition: 'test "${CLAIMED}" = "yes"'
    continue_on: skipped
    working_dir: ${env.PROJECT_WORKSPACE}
    run: |
      set -eu
      RUN_DIR="/tmp/dagu-agent/${ISSUE_NUMBER}/clarify"
      export RUN_DIR
      mkdir -p "$RUN_DIR"
      rm -f "$RUN_DIR/result.json" "$RUN_DIR/report.md"

      # Comments matter here in a way they do not for the implementer: on a
      # second pass the human's answers to the previous round of questions are
      # in the thread, and they are the whole reason this run exists.
      gh issue view "${ISSUE_NUMBER}" --repo "${env.PROJECT_REPO}" \
        --json number,title,body,comments > "$RUN_DIR/issue.json"

      # Stdout, not stderr: dagu shows the stdout log in the UI, and a run with
      # none reads as "<No log output>". Whoever opens this run should be able
      # to see which issue it picked up without opening the working files.
      title=$(jq -r '.title' "$RUN_DIR/issue.json")
      comments=$(jq -r '.comments | length' "$RUN_DIR/issue.json")
      printf 'repo:     %s\n' "${env.PROJECT_REPO}"
      printf 'issue:    #%s %s\n' "${ISSUE_NUMBER}" "$title"
      printf 'url:      https://github.com/%s/issues/%s\n' "${env.PROJECT_REPO}" "${ISSUE_NUMBER}"
      printf 'comments: %s (this is %s)\n' "$comments" \
        "$([ "$comments" -eq 0 ] && echo 'a first pass' || echo 'a re-run over the thread')"
      printf 'skill:    %s\n' "${env.CLARIFY_SKILL}"
      printf 'run_dir:  %s\n' "$RUN_DIR"

      # The issue body and every comment are untrusted text. They only ever
      # reach the agent as a file, never interpolated into a shell command or
      # into the prompt string.
      #
      # The `report` step below posts its own comments back onto this issue --
      # the requirements brief, the questions, the operator instruction to
      # relabel. Those are marked with an `agent:brief` / `agent:questions`
      # HTML comment. Without filtering them out here, a re-run folds the
      # pipeline's own prior output (including operator-facing instructions
      # like "relabel this issue agent:todo") back into brief.md, where the
      # clarify agent -- correctly, since it cannot tell pipeline scaffolding
      # from an injected instruction -- refuses to proceed.
      jq -r '
        "# Issue #\(.number): \(.title)\n\n\(.body // "(no description)")\n"
        + (if (.comments | length) == 0 then ""
           else "\n---\n\n## Thread\n\n"
                + ([.comments[]
                    | select(.body | test("<!-- agent:(brief|questions) -->") | not)
                    | "### \(.author.login) at \(.createdAt)\n\n\(.body)"]
                   | join("\n\n"))
           end)
      ' "$RUN_DIR/issue.json" > "$RUN_DIR/brief.md"

      sed -e "s|{{SKILL}}|${env.CLARIFY_SKILL}|g" \
          -e "s|{{REPO}}|${env.PROJECT_REPO}|g" \
          -e "s|{{WORKSPACE}}|${env.PROJECT_WORKSPACE}|g" \
          -e "s|{{ISSUE_NUMBER}}|${ISSUE_NUMBER}|g" \
          -e "s|{{BRIEF_PATH}}|$RUN_DIR/brief.md|g" \
          -e "s|{{REPORT_PATH}}|$RUN_DIR/report.md|g" \
          -e "s|{{RESULT_PATH}}|$RUN_DIR/result.json|g" \
          "${consts.prompts_dir}/clarify-issue.md" > "$RUN_DIR/prompt.md"

  - id: clarify
    depends: fetch_issue
    preconditions:
      - condition: 'test "${CLAIMED}" = "yes"'
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 1800          # read-only exploration; 30 min is generous
    retry_policy:
      limit: 0
      interval_sec: 0
    continue_on:
      failure: true            # report the outcome on the issue either way
    run: ${consts.agent_runner} "/tmp/dagu-agent/${ISSUE_NUMBER}/clarify/prompt.md" ${consts.budget_usd} "/tmp/dagu-agent/${ISSUE_NUMBER}/clarify/agent-stream.jsonl"

  - id: report
    depends: clarify
    preconditions:
      - condition: 'test "${CLAIMED}" = "yes"'
    working_dir: ${env.PROJECT_WORKSPACE}
    run: |
      set -u
      RUN_DIR="/tmp/dagu-agent/${ISSUE_NUMBER}/clarify"
      result="$RUN_DIR/result.json"
      body="$RUN_DIR/report.md"

      result_status=$(jq -r '.status // "failed"' "$result" 2>/dev/null || echo failed)

      # A missing report.md is only survivable for the failure path, where this
      # step can write a useful one itself. For the other two the agent's own
      # prose is the entire product, so treat its absence as a failed run.
      if [ ! -s "$body" ] && [ "$result_status" != "failed" ]; then
        echo "[report] status=$result_status but report.md is empty; treating as failed" >&2
        result_status=failed
      fi

      case "$result_status" in
        ready)
          state="agent:ready-to-implement"
          # The marker is the handoff contract: the implementer reads the newest
          # comment carrying it and treats that as the brief, in preference to
          # the raw issue body.
          printf '\n<!-- agent:brief -->\n' >> "$body"
          ;;
        needs-clarification)
          state="agent:revising"
          # Indented to the block scalar's base so YAML strips it back to
          # column 0; a here-doc line further left would end the scalar.
          cat >> "$body" <<'EOF'

      ---

      Answer above, then relabel this issue `agent:todo`. The clarifier re-reads
      the whole thread and either promotes it or asks a follow-up.

      <!-- agent:questions -->
      EOF
          ;;
        *)
          state="agent:failed"
          reason=$(jq -r '.error // ""' "$result" 2>/dev/null || echo "")
          [ -n "$reason" ] || reason="The agent wrote no result.json. It was most likely killed or timed out after 30m. Check agent-stream.jsonl."
          cat > "$body" <<EOF
      Clarification run \`${context.run.id}\` did not complete.

      $reason

      Working files: \`$RUN_DIR\`
      EOF
          ;;
      esac

      gh issue comment "${ISSUE_NUMBER}" --repo "${env.PROJECT_REPO}" --body-file "$body"
      ${consts.bin_dir}/set-state.sh "${env.PROJECT_REPO}" "${ISSUE_NUMBER}" "$state"

      # Surface a failed clarification as a red run in the dagu UI. `ready` and
      # `needs-clarification` are both successful outcomes -- asking a question
      # is the job, not a failure of it.
      test "$result_status" != "failed"

handler_on:
  # Covers what `report` cannot reach: timeout, worker loss, a step dying before
  # it runs. Without this the issue stays pinned to agent:clarifying and the
  # clarify poller never sees it again.
  failure:
    run: |
      if gh issue view "${ISSUE_NUMBER}" --repo "${env.PROJECT_REPO}" \
           --json labels --jq '.labels[].name' | grep -qx "agent:clarifying"; then
        ${consts.bin_dir}/set-state.sh "${env.PROJECT_REPO}" "${ISSUE_NUMBER}" "agent:failed"
        gh issue comment "${ISSUE_NUMBER}" --repo "${env.PROJECT_REPO}" \
          --body "Clarification run \`${context.run.id}\` failed before reporting. Log: ${context.paths.log_file}"
      fi
