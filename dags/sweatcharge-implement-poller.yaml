type: graph
description: Implement cuongkane/sweatcharge issues labelled agent:ready-to-implement
schedule: "*/10 * * * *"
overlap_policy: skip

worker_selector:
  host: "true"

# This DAG is what bounds implementation concurrency, and it does so without a
# cross-issue mutex label. It claims up to `max_parallel` issues per tick, the
# children run inline on this worker, and `overlap_policy: skip` means the next
# tick is dropped while any of them is still going. So at most `max_parallel`
# implementations exist at a time.
#
# The ceiling used to be one, because `make test-ci` in the target repo derived
# its Compose project name from the compose file's directory -- identical in
# every worktree -- so two suites would share a database and tear down each
# other's containers. That stack is now namespaced per checkout
# (`swc-test-<hash>` in the SweatCharge Makefile) and publishes no host ports,
# which is what makes a ceiling above one safe. Raise `max_parallel` further
# only if the Mac has the RAM for that many Docker test stacks plus that many
# coding-agent processes at once.
#
# The tick, not a free slot, is what releases capacity: a tick that claims two
# issues blocks the next tick until BOTH children finish. A fast run therefore
# waits for a slow one before the next issue starts. That is deliberate -- it
# keeps the "one poller queries a given label" invariant that relabel.sh's
# check-then-act guard relies on, and the alternative (overlapping ticks) would
# put two claim loops on the same label at once.

consts:
  - repo: cuongkane/sweatcharge
  - workspace: /Users/lexuancuong/CUONG/SWC
  - skill: implement-sweatcharge-feature
  - bin_dir: /Users/lexuancuong/CUONG/DAGU/bin
  - max_parallel: "2"

steps:
  # Pick and claim in one step, repeatedly: pick-oldest.sh reads the queue label
  # live, so once an issue has been relabelled it is invisible to the next
  # iteration and the loop walks down the queue in age order.
  #
  # stdout is this step's output variable, so every progress line goes to
  # stderr; only the JSON array is printed.
  - id: claim
    run: |
      set -u
      claimed=""
      i=0
      while [ "$i" -lt ${consts.max_parallel} ]; do
        i=$((i + 1))

        issue=$(${consts.bin_dir}/pick-oldest.sh ${consts.repo} \
          agent:ready-to-implement agent:implementing) || exit 1
        if [ "$issue" = "none" ]; then
          break
        fi

        # A failed claim (exit 10) means the issue left agent:ready-to-implement
        # between the pick and the relabel -- a hand relabel, most likely. It
        # still costs this tick an iteration, so a tick that hits one dispatches
        # fewer than max_parallel children; the next tick, ten minutes later,
        # fills the queue back up. That is the deliberate trade for keeping the
        # loop bounded by a counter rather than by "keep going until you have
        # max_parallel claims", which could spin on an issue it can never claim.
        if ${consts.bin_dir}/relabel.sh ${consts.repo} "$issue" \
             agent:ready-to-implement agent:implementing; then
          claimed="$claimed $issue"
        fi
      done

      echo "[claim] claimed:${claimed:- none}" >&2
      # The trailing newline matters: with no input line at all, `jq -R` emits
      # nothing, the output variable is empty rather than `[]`, and the
      # precondition below would let an idle tick dispatch on an empty list.
      printf '%s\n' "$claimed" | jq -R -c 'split(" ") | map(select(length > 0))'
    output: ISSUES

  # One child per claimed issue, running concurrently. A child that fails does
  # not stop its siblings; dagu reports the failure once they have all finished,
  # and each child's own `report` step / failure handler has already moved its
  # issue out of agent:implementing by then.
  - id: dispatch
    depends: claim
    preconditions:
      - condition: 'test "${ISSUES}" != "[]"'
    action: dag.run
    with:
      dag: agent-implement-issue
      params:
        REPO: ${consts.repo}
        WORKSPACE: ${consts.workspace}
        SKILL: ${consts.skill}
        ISSUE_NUMBER: "${ITEM}"
    # No `max_concurrent` here: it only accepts an integer literal, so it could
    # not track `max_parallel` and would be a second ceiling to keep in sync.
    # The claim loop already caps the list at `max_parallel`, which makes
    # unbounded concurrency over that list exactly the intended ceiling.
    parallel:
      items: ${ISSUES}
    continue_on: skipped
