type: graph
description: Claim and implement clarified GitHub issues, one visible phase at a time
schedule: "*/10 * * * *"
overlap_policy: all
queue: implementation
max_output_size: 10485760

# The implementation used to be a single agent step: one prompt, one two-hour
# timeout, one $15 budget, and no way to tell from the run view whether it was
# exploring, writing code, or stuck. When it died it reported one undifferentiated
# failure and the next attempt started from nothing.
#
# It is now the skill's own phases, one step each. Each phase has its own timeout,
# its own budget, its own model tier, and its own line in the run view, so
# progress is observable while it works and a failure names the phase it happened
# in. Phases hand off through files -- `state.json`, the worktree, and the
# OpenSpec change directory -- not through a live session, so a single phase can
# be re-run on its own against a run directory that already exists.
#
# The steps stay one line each because their bodies live in scripts/implement/ and
# their prompts in prompts/implement/. Editing what a phase *does* means editing a
# script or a prompt; this file only says what order they happen in.
#
# Deterministic phases -- the worktree, the verification commands, the archive,
# the push and the pull request -- are shell, with no model involved. They are
# exact, checkable operations; a language model could only make them less
# reliable and more expensive.

worker_selector:
  host: "true"

dotenv: /Users/lexuancuong/CUONG/DAGU/project.env

params:
  - name: ISSUE_NUMBER
    type: string
    default: ""
    description: Optional issue to claim immediately instead of polling the queue

consts:
  - impl: /Users/lexuancuong/CUONG/DAGU/scripts/implement
  - run_dir_root: /tmp/dagu-agent

steps:
  # ---------------------------------------------------------------- claim ----
  - id: claim_ready_issue
    run: ${consts.impl}/claim-ready-issue.sh "${env.PROJECT_REPO}" "${params.ISSUE_NUMBER}"
    output:
      claimed:
        from: stdout
        decode: json
        select: .claimed
      issue_number:
        from: stdout
        decode: json
        select: .issue_number
      message:
        from: stdout
        decode: json
        select: .message

  # Everything below is gated on the claim. An idle poll -- the common case, ten
  # times an hour -- costs one `gh` call and stops here.
  - id: fetch_issue_brief
    depends: claim_ready_issue
    preconditions: &claimed
      - condition: 'test "${claim_ready_issue.output.claimed}" = "true"'
    working_dir: ${env.PROJECT_WORKSPACE}
    continue_on: &carry_on
      failure: true            # report the outcome on the issue either way
    run: >
      ${consts.impl}/fetch-issue-brief.sh
      "${env.PROJECT_REPO}"
      "${claim_ready_issue.output.issue_number}"
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_WORKSPACE}"
      "${env.IMPLEMENT_SKILL}"

  - id: announce_start_on_issue
    depends: fetch_issue_brief
    preconditions: *claimed
    continue_on: *carry_on     # a missing notice must not cost us the run
    run: >
      ${consts.impl}/announce-start.sh
      "${env.PROJECT_REPO}"
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${context.run.id}"

  - id: create_feature_worktree
    depends: announce_start_on_issue
    preconditions: *claimed
    continue_on: *carry_on
    run: >
      ${consts.impl}/create-worktree.sh
      "${env.PROJECT_WORKSPACE}"
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"

  # ------------------------------------------------------- the agent work ----
  # run-phase.sh builds the prompt, runs the agent at the given model tier, and
  # enforces that phase's exit contract. Tier and budget are the two numbers worth
  # tuning per phase; they are here rather than buried in a script for that reason.
  - id: explore_codebase_context
    depends: create_feature_worktree
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 900
    retry_policy: &no_retry
      limit: 0                 # a partial phase already changed the worktree
      interval_sec: 0          # required by the schema even when retries are off
    continue_on: *carry_on
    run: >
      ${consts.impl}/run-phase.sh explore
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      fast 1

  - id: write_openspec_proposal
    depends: explore_codebase_context
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 900
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/run-phase.sh propose
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      standard 2

  # The long one, now two steps: writing the implementation and writing its tests
  # are separate phases. They were one, which meant a phase that ran out of budget
  # or timed out left an unknowable mixture of the two, and the run view could not
  # say whether the code existed but was untested or neither existed. Splitting
  # them also stops the tests being written by the same pass that is trying to get
  # the feature working -- the tests phase starts from the diff, with the testing
  # standards loaded, and is allowed to reject the implementation.
  - id: write_implementation_code
    depends: write_openspec_proposal
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 3600
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/run-phase.sh code
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      deep 5

  # The agent loops on its own focused tests here until they pass, fixing the
  # implementation when a test is right and the code is wrong. It is deliberately
  # not a shell loop: the focused tests differ per task and the authoritative,
  # shell-run verdict is the very next step, which loops with its own fix phase.
  - id: write_tests_until_passing
    depends: write_implementation_code
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 3600
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/run-phase.sh tests
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      deep 4

  # -------------------------------------------------------- verification ----
  # One step, not three. The target repository's own commands run from shell and
  # their exit status is the verdict; when they fail, the fix phase runs and the
  # suite runs again, in a loop inside the step. It was previously an unrolled
  # run/fix/rerun chain gated on preconditions -- which put a hard ceiling of one
  # fix on the graph, and spent three lines of the run view saying so.
  #
  # `standard`, not `deep`, and this is the phase where that is safest: the fix
  # agent is handed a concrete failure to react to rather than an open problem to
  # solve, and the shell suite re-runs after every attempt, so a bad fix is
  # caught mechanically rather than shipped. It is also the phase that runs most
  # often -- up to twice here and once more after the review -- which makes it
  # the most expensive tier in the DAG to leave at deep.
  - id: run_ci_until_passing
    depends: write_tests_until_passing
    preconditions: *claimed
    timeout_sec: 7200          # the whole loop, not one pass of the suite
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/run-ci-until-passing.sh
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      3 standard 2 verify

  # ------------------------------------------------------------- review ----
  # Reviewing and fixing are two steps, not one. The review writes its findings to
  # `review-comments.md` and changes nothing; the next step acts on that file. The
  # cost is one extra agent run; what it buys is a reviewer's verdict that exists
  # on disk as a reviewable artefact instead of dissolving into the diff, and a
  # visible answer to "did the review actually find anything?".
  - id: review_code
    depends: run_ci_until_passing
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 1800
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/run-phase.sh review
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      deep 3

  # Resolve the comments, then verify -- one step, because the two are not
  # independent. The fixes made here are unreviewed code, the skill requires the
  # frontend production build to come from the *final* source state, and a review
  # fix that broke something should get fixed rather than end the run red one step
  # from the pull request. A review that found nothing skips the agent and costs
  # one clean pass of the suite.
  - id: resolve_review_comment
    depends: review_code
    working_dir: ${env.PROJECT_WORKSPACE}
    preconditions: *claimed
    timeout_sec: 7200
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/resolve-review-comments.sh
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      deep 3 2

  # ------------------------------------------------ specifications, then PR ----
  # Syncing and archiving are one step: syncing without archiving leaves the
  # change active on top of specs that already describe it, and archiving without
  # syncing throws the deltas away. The agent merges the prose; the archive is
  # `openspec archive --yes` from shell, because the repository's own archive
  # skill prompts for a change and for warning confirmation and cannot run
  # unattended. The division is inside the script, not in the graph.
  - id: finalize_openspec_change
    depends: resolve_review_comment
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 1500          # the sync phase and the archive, not one of them
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/finalize-openspec-change.sh
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_REPO}" "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      fast 1

  # Likewise one step: the description exists only to be the body of the pull
  # request opened straight after it. The agent writes the prose, shell decides
  # where the code actually goes.
  - id: ship_code
    depends: finalize_openspec_change
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    timeout_sec: 1800          # the description and the push
    retry_policy: *no_retry
    continue_on: *carry_on
    run: >
      ${consts.impl}/ship-code.sh
      "${env.PROJECT_REPO}"
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${env.PROJECT_WORKSPACE}" "${env.IMPLEMENT_SKILL}"
      fast 1

  # --------------------------------------------------------------- report ----
  # Runs whichever phase the run reached. It reads state.json to learn where the
  # run stopped and names that phase in the comment, so a killed run says how far
  # it got instead of only that it died. The label recovery that was the step
  # after this one is now the second half of the same script, and still runs when
  # the reporting half fails -- what was `continue_on` between two steps is a
  # `|| true` between two lines.
  #
  # No `continue_on` here, deliberately: nothing follows, and a non-completed run
  # has to reach the UI as red.
  - id: report_run_outcome
    depends: ship_code
    preconditions: *claimed
    working_dir: ${env.PROJECT_WORKSPACE}
    run: >
      ${consts.impl}/report-and-recover.sh
      "${env.PROJECT_REPO}"
      "${consts.run_dir_root}/${claim_ready_issue.output.issue_number}/implement"
      "${claim_ready_issue.output.issue_number}"
      "${context.run.id}"
      "${context.paths.log_file}"
