type: graph
description: Claim and implement clarified GitHub issues
schedule: "*/10 * * * *"
overlap_policy: all
queue: implementation
max_output_size: 10485760

worker_selector:
  host: "true"

dotenv: /Users/lexuancuong/CUONG/DAGU/project.env

params:
  - name: ISSUE_NUMBER
    type: string
    default: ""
    description: Optional issue to claim immediately instead of polling the queue

consts:
  - prompts_dir: /Users/lexuancuong/CUONG/DAGU/prompts
  - bin_dir: /Users/lexuancuong/CUONG/DAGU/bin
  - agent_runner: /Users/lexuancuong/CUONG/DAGU/run-agent.sh
  - budget_usd: "15"

steps:
  - id: claim
    run: |
      set -eu
      if [ -n "${params.ISSUE_NUMBER}" ]; then
        issue="${params.ISSUE_NUMBER}"
      else
        issue=$(${consts.bin_dir}/pick-oldest.sh "${env.PROJECT_REPO}" \
          agent:ready-to-implement agent:implementing) || exit 1
      fi

      if [ "$issue" = none ]; then
        jq -nc '{
          claimed: false,
          issue_number: "",
          message: "No issue is currently ready to implement. This poll completed without work."
        }'
      elif ${consts.bin_dir}/relabel.sh "${env.PROJECT_REPO}" "$issue" \
             agent:ready-to-implement agent:implementing; then
        jq -nc --arg issue "$issue" '{
          claimed: true,
          issue_number: $issue,
          message: ("Claimed issue #" + $issue + " for implementation.")
        }'
      else
        jq -nc --arg issue "$issue" '{
          claimed: false,
          issue_number: "",
          message: ("Issue #" + $issue + " was selected but could not be claimed because its state changed.")
        }'
      fi
    output:
      claimed:
        from: stdout
        decode: json
        select: .claimed
      issue_number:
        from: stdout
        decode: json
        select: .issue_number
      message:
        from: stdout
        decode: json
        select: .message

  - id: fetch_issue
    depends: claim
    preconditions:
      - condition: 'test "${claim.output.claimed}" = "true"'
    working_dir: ${env.PROJECT_WORKSPACE}
    env:
      - RUN_DIR: /tmp/dagu-agent/${claim.output.issue_number}/implement
    continue_on:
      failure: true
    run: |
      set -eu
      mkdir -p "$RUN_DIR"
      rm -f "$RUN_DIR/result.json" "$RUN_DIR/report.md"

      gh issue view "${claim.output.issue_number}" --repo "${env.PROJECT_REPO}" \
        --json number,title,body,comments > "$RUN_DIR/issue.json"

      # Stdout, not stderr: dagu shows the stdout log in the UI, and a run with
      # Whoever opens this run should be able to see which issue it picked up
      # without opening the working files.
      title=$(jq -r '.title' "$RUN_DIR/issue.json")
      comments=$(jq -r '.comments | length' "$RUN_DIR/issue.json")
      printf 'repo:     %s\n' "${env.PROJECT_REPO}"
      printf 'issue:    #%s %s\n' "${claim.output.issue_number}" "$title"
      printf 'url:      https://github.com/%s/issues/%s\n' "${env.PROJECT_REPO}" "${claim.output.issue_number}"
      printf 'comments: %s\n' "$comments"
      printf 'skill:    %s\n' "${env.IMPLEMENT_SKILL}"
      printf 'run_dir:  %s\n' "$RUN_DIR"

      # The clarifier's refined brief supersedes the raw issue body: it has
      # already resolved the ambiguities and folded in the human's answers, and
      # this agent is not allowed to ask anything. Fall back to the body only
      # when the issue reached here without ever passing through clarification
      # -- a hand-applied label, or `make implement`.
      brief=$(jq -r '[.comments[] | select(.body | contains("<!-- agent:brief -->"))]
                     | last | .body // empty' "$RUN_DIR/issue.json")

      # The issue body and every comment are untrusted text. They only ever
      # reach the agent as a file, never interpolated into a shell command or
      # into the prompt string.
      if [ -n "$brief" ]; then
        echo "brief:    clarifier's refined <!-- agent:brief --> comment"
        {
          jq -r '"# Issue #\(.number): \(.title)"' "$RUN_DIR/issue.json"
          printf '\n\n'
          printf '%s\n' "$brief"
        } > "$RUN_DIR/brief.md"
      else
        echo "brief:    WARNING: no <!-- agent:brief --> comment; using the raw issue body"
        jq -r '"# Issue #\(.number): \(.title)\n\n\(.body // "(no description)")"' \
          "$RUN_DIR/issue.json" > "$RUN_DIR/brief.md"
      fi

      sed -e "s|{{SKILL}}|${env.IMPLEMENT_SKILL}|g" \
          -e "s|{{REPO}}|${env.PROJECT_REPO}|g" \
          -e "s|{{WORKSPACE}}|${env.PROJECT_WORKSPACE}|g" \
          -e "s|{{ISSUE_NUMBER}}|${claim.output.issue_number}|g" \
          -e "s|{{BRIEF_PATH}}|$RUN_DIR/brief.md|g" \
          -e "s|{{REPORT_PATH}}|$RUN_DIR/report.md|g" \
          -e "s|{{RESULT_PATH}}|$RUN_DIR/result.json|g" \
          "${consts.prompts_dir}/implement-issue.md" > "$RUN_DIR/prompt.md"

  - id: announce
    depends: fetch_issue
    preconditions:
      - condition: 'test "${claim.output.claimed}" = "true"'
    working_dir: ${env.PROJECT_WORKSPACE}
    env:
      - RUN_DIR: /tmp/dagu-agent/${claim.output.issue_number}/implement
    continue_on:
      failure: true          # a missing notice must not cost us the run
    run: |
      set -u
      # The implementation takes 30-90 min with nothing visible on the issue
      # until `report` runs. Say up front that it has been picked up, so a human
      # reading their notifications does not start the same work by hand.
      gh issue comment "${claim.output.issue_number}" --repo "${env.PROJECT_REPO}" --body "$(cat <<EOF
      🤖 Started implementing this issue.

      Run \`${context.run.id}\` is working on it now; a pull request or a report
      will be posted here when it finishes. No action needed in the meantime.
      EOF
      )"

  - id: implement
    depends: announce
    preconditions:
      - condition: 'test "${claim.output.claimed}" = "true"'
    working_dir: ${env.PROJECT_WORKSPACE}
    env:
      - RUN_DIR: /tmp/dagu-agent/${claim.output.issue_number}/implement
    timeout_sec: 7200          # 2h ceiling; the skill's full flow is 30-90 min
    retry_policy:
      limit: 0                 # a partial run already created a branch and worktree
      interval_sec: 0          # required by the schema even when retries are off
    continue_on:
      failure: true            # report the outcome on the issue either way
    run: ${consts.agent_runner} "$RUN_DIR/prompt.md" ${consts.budget_usd} "$RUN_DIR/agent-stream.jsonl"

  - id: report
    depends: implement
    preconditions:
      - condition: 'test "${claim.output.claimed}" = "true"'
    working_dir: ${env.PROJECT_WORKSPACE}
    env:
      - RUN_DIR: /tmp/dagu-agent/${claim.output.issue_number}/implement
    continue_on:
      failure: true
    run: |
      set -u
      result="$RUN_DIR/result.json"
      body="$RUN_DIR/report.md"

      result_status=$(jq -r '.status // "failed"' "$result" 2>/dev/null || echo failed)
      field() { jq -r "$1 // \"\"" "$result" 2>/dev/null || echo ""; }

      if [ ! -s "$body" ] && [ "$result_status" != "failed" ]; then
        echo "[report] status=$result_status but report.md is empty; treating as failed" >&2
        result_status=failed
      fi

      case "$result_status" in
        completed)
          pr_url=$(field .pr_url)
          pr_number=${pr_url##*/}

          # A completed run with no usable PR URL is a failed run. The agent is
          # told never to invent one, and the delivery poller cannot do anything
          # with an issue whose PR it cannot find.
          case "$pr_number" in
            ''|*[!0-9]*)
              echo "[report] status=completed but pr_url is unusable ('$pr_url')" >&2
              result_status=failed
              ;;
            *)
              state="agent:reviewing"
              # This marker is how the delivery poller finds the PR. It is
              # written here, from GitHub's own URL, rather than by the agent --
              # the one fact in this pipeline that must not be paraphrased.
              printf '\n<!-- agent:pr=%s -->\n' "$pr_number" >> "$body"
              ;;
          esac
          ;;
        blocked)
          # Rare by design: this agent runs with no human in the loop, so a
          # blocker means clarification missed something material. Send it back
          # through the clarifier rather than guessing. The worktree is left in
          # place so the next attempt can see how far this one got.
          state="agent:revising"
          cat >> "$body" <<'EOF'

      ---

      The implementer stopped on a blocker that clarification did not cover.
      Answer above, then relabel this issue `agent:todo` to re-run clarification.

      <!-- agent:questions -->
      EOF
          ;;
        *)
          # Anything else -- including a garbled status the agent invented --
          # is a failure. Falling through with $state unset would trip `set -u`
          # and report nothing at all.
          result_status=failed
          ;;
      esac

      if [ "$result_status" = "failed" ]; then
        state="agent:failed"
        reason=$(field .error)
        [ -n "$reason" ] || reason="The agent wrote no result.json. It was most likely killed or timed out after 2h. Check agent-stream.jsonl."
        cat > "$body" <<EOF
      Implementation run \`${context.run.id}\` did not complete.

      $reason

      Working files: \`$RUN_DIR\`
      EOF
      fi

      gh issue comment "${claim.output.issue_number}" --repo "${env.PROJECT_REPO}" --body-file "$body"
      ${consts.bin_dir}/set-state.sh "${env.PROJECT_REPO}" "${claim.output.issue_number}" "$state"

      # Surface a non-completed outcome as a red run in the dagu UI.
      test "$result_status" = "completed"

  - id: recover
    depends: report
    preconditions:
      - condition: 'test "${claim.output.claimed}" = "true"'
    working_dir: ${env.PROJECT_WORKSPACE}
    run: |
      set -eu
      labels=$(gh issue view "${claim.output.issue_number}" --repo "${env.PROJECT_REPO}" \
        --json labels --jq '.labels[].name')
      if printf '%s\n' "$labels" | grep -qx agent:implementing; then
        ${consts.bin_dir}/set-state.sh "${env.PROJECT_REPO}" "${claim.output.issue_number}" agent:failed
        gh issue comment "${claim.output.issue_number}" --repo "${env.PROJECT_REPO}" \
          --body "Implementation run \`${context.run.id}\` failed before reporting. Log: ${context.paths.log_file}"
        exit 1
      fi
      if printf '%s\n' "$labels" | grep -Eq '^agent:(failed|revising)$'; then
        exit 1
      fi
